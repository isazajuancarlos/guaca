# SPDX-License-Identifier: AGPL-3.0-or-later
# CI de guaca: test + clippy. La fachada de protección la consumen medico e
# informes por dep git anclada a tag; que se rompa aquí no debe descubrirse allá.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test

  cadena-suministro:
    name: cargo-deny (supply chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cargo-deny: exige que toda dependencia venga de una fuente autorizada
      # (crates.io), prohíbe comodines de versión y controla licencias — la
      # defensa contra que una dep se traiga de una fuente inesperada (vector del
      # ataque Atomic Arch). Config en deny.toml.
      - name: cargo-deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check
